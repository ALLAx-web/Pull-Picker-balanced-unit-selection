<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Pull Picker</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1b1f24;--mu:#6b7280;--bd:#e3e6ea;--ac:#2563eb;--ac2:#dbeafe;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111418;--card:#1a1f26;--tx:#e8eaed;--mu:#9aa3af;--bd:#2c333c;--ac:#60a5fa;--ac2:#1e3a5f}}
:root[data-theme="dark"]{--bg:#111418;--card:#1a1f26;--tx:#e8eaed;--mu:#9aa3af;--bd:#2c333c;--ac:#60a5fa;--ac2:#1e3a5f}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
.w{max-width:900px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:0 0 12px}
.c{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:12px}
.r{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
button,select,input{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:8px 12px}
button{cursor:pointer}button.p{background:var(--ac);color:#fff;border-color:var(--ac)}
button.on{background:var(--ac2);border-color:var(--ac);font-weight:600}
input[type=number]{width:80px}
.mu{color:var(--mu);font-size:13px}
.ov{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--bd);white-space:nowrap}
th{color:var(--mu);font-weight:600}
.zr{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:8px}.zr b{width:62px;font-size:13px}button.off{opacity:.45;text-decoration:line-through}button.na{opacity:.3;cursor:not-allowed}button.sm{padding:4px 10px;font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.chip{background:var(--ac2);border-radius:99px;padding:2px 10px;font-size:13px}
</style></head><body><div class="w">
<h1>⛏ Pull Picker — balanced unit selection</h1>
<div class="c"><div class="r">
<span>Pull:</span><button id="b30" onclick="setN(30)">30</button><button id="b40" class="on" onclick="setN(40)">40</button>
<input type="number" id="cn" min="1" value="40" onchange="setN(+this.value)">
<select id="st"><option value="boards">Prefer most dead boards</option><option value="random">Random miner</option></select>
<button class="p" onclick="pick()">Pick</button>
</div>
<div class="r" style="margin-top:10px"><label class="mu">Load unresolved alerts (CSV or Excel): <input type="file" id="f" accept=".csv,.xlsx,.xls"></label></div>
<div style="margin-top:12px"><div class="r"><b>Target location</b><button class="sm" onclick="selAll(1)">All on</button><button class="sm" onclick="selAll(0)">All off</button></div><div id="sel_"></div></div>
<div class="mu" id="info" style="margin-top:12px"></div></div>
<div id="out"></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
const ZONES={"Z1A":[15,26],"Z1B":[1,14],"Z1C":[27,38],"Z1D":[39,50],"Z2A":[51,62],"Z2B":[63,74],"Z2C":[75,86],"Z2D":[87,98],"Z2E":[99,110],"Z2F":[111,122],"Z2G":[123,134],"Z2H":[135,146],"Z2I":[147,158],"Z2J":[159,170],"Z3A":[171,182],"Z3B":[183,194],"Z3C":[195,206],"Z3D":[207,218],"Z3E":[219,228],"Z4A":[229,237],"Z4B":[238,246],"Z4C":[247,255]};
let N=40,miners=[],last=[],sel=new Set(),src="";
const DATA=[];
function cl(c){for(const k in ZONES)if(c>=ZONES[k][0]&&c<=ZONES[k][1])return k;return "?"}
function load(rows){miners=rows.map(r=>{const c=+r[0].split(".")[1];const b=String(r[2]).split(",").filter(Boolean).length;return{ip:r[0],sn:r[1],bd:b,bl:r[2],mac:r[3]||"",c,cl:cl(c)}}).filter(m=>m.c);
 const cs=new Set(miners.map(m=>m.c));document.getElementById("info").textContent=miners.length+" miners in "+cs.size+" containers, "+new Set(miners.map(m=>m.cl)).size+" clusters";sel=new Set(miners.map(m=>m.cl));last=[];document.getElementById("out").innerHTML="";rs()}
function cnt(k){return new Set(miners.filter(m=>m.cl==k).map(m=>m.c)).size}
function rs(){let h="";for(const z of ["1","2","3","4"]){const ks=Object.keys(ZONES).filter(k=>k[1]==z);const av=ks.filter(k=>cnt(k));const on=av.length&&av.every(k=>sel.has(k));
 h+='<div class="zr"><b>Zone '+z+'</b><button class="sm'+(on?" on":"")+'" onclick="tz('+z+')">All</button>'+ks.map(k=>{const n=cnt(k);return n?'<button class="sm'+(sel.has(k)?" on":" off")+'" onclick="tc(&quot;'+k+'&quot;)">'+k+" ("+n+")</button>":'<button class="sm na" disabled>'+k+" (0)</button>"}).join("")+"</div>"}
 sel_.innerHTML=h;let a=new Set(miners.filter(m=>sel.has(m.cl)).map(m=>m.c)).size;document.getElementById("info").textContent="Source: "+src+" · "+miners.length+" miners · "+new Set(miners.map(m=>m.c)).size+" containers · selected: "+a+" containers"}
function tc(k){sel.has(k)?sel.delete(k):sel.add(k);rs()}
function tz(z){z=String(z);const av=Object.keys(ZONES).filter(k=>k[1]==z&&cnt(k));const on=av.every(k=>sel.has(k));av.forEach(k=>on?sel.delete(k):sel.add(k));rs()}
function selAll(v){sel=v?new Set(miners.map(m=>m.cl)):new Set();rs()}
function setN(n){N=Math.max(1,n|0);cn.value=N;b30.className=N==30?"on":"";b40.className=N==40?"on":""}
function sh(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}
function pick(){
 if(!miners.length){document.getElementById("info").textContent="No data loaded. Choose your unresolved alerts file first.";return}
 if(!sel.size){document.getElementById("out").innerHTML='<div class="c">Select at least one cluster.</div>';last=[];return}
 const byC={};miners.filter(m=>sel.has(m.cl)).forEach(m=>(byC[m.c]??=[]).push(m));
 const rnd=st.value=="random";
 const byCl={};Object.keys(byC).forEach(c=>{const k=byC[c][0].cl;(byCl[k]??=[]).push(+c)});
 const out=[];const used={};
 // each round: one unit per container (no repeats); clusters round-robin so zones stay balanced
 while(out.length<N){
  const q={};let any=false;
  for(const k in byCl){q[k]=sh(byCl[k]).filter(c=>(used[c]||0)<byC[c].length);if(q[k].length)any=true}
  if(!any)break;
  const keys=sh(Object.keys(q));
  // stay in round: containers used this round
  while(out.length<N){let prog=false;
   for(const k of keys){if(out.length>=N)break;const c=q[k].shift();if(c==null)continue;prog=true;
    const left=byC[c].filter(m=>!out.includes(m));
    const m=rnd?left[Math.random()*left.length|0]:left.sort((a,b)=>b.bd-a.bd||Math.random()-.5)[0];
    out.push(m);used[c]=(used[c]||0)+1}
   if(!prog)break}
 }
 last=out;show()}
function show(){
 const o=last;const s=o.slice().sort((a,b)=>a.c-b.c);
 const reps=o.length-new Set(o.map(m=>m.c)).size;
 const z={};o.forEach(m=>z[m.cl]=(z[m.cl]||0)+1);
 let h='<div class="c"><b>'+o.length+' units</b> · '+new Set(o.map(m=>m.c)).size+' containers · '+o.reduce((a,m)=>a+m.bd,0)+' dead boards · '+(reps?reps+' repeated container(s)':'no repeated containers')+
 '<div class="chips">'+Object.keys(z).sort().map(k=>'<span class="chip">'+k+': '+z[k]+'</span>').join("")+'</div>'+
 '<div class="r" style="margin-top:10px"><button onclick="cp()">Copy list</button><button onclick="dl()">Download CSV</button><button onclick="pick()">Re-pick</button></div></div>'+
 '<div class="c ov"><table><tr><th>Container</th><th>Cluster</th><th>Miner IP</th><th>MAC</th><th>Serial</th><th>Boards</th></tr>'+
 s.map(m=>'<tr><td>C'+m.c+'</td><td>'+m.cl+'</td><td>'+m.ip+'</td><td>'+m.mac+'</td><td>'+m.sn+'</td><td>'+hb(m.bl)+'</td></tr>').join("")+'</table></div>';
 out.innerHTML=h}
function hb(b){return String(b||'').split(',').map(x=>x.trim()).filter(Boolean).map(x=>'HB'+x).join(', ')||'-'}
const rows=()=>last.slice().sort((a,b)=>a.c-b.c).map(m=>['C'+m.c,m.cl,m.ip,m.mac,m.sn,'"'+hb(m.bl)+'"']);
function cp(){const t=rows().map(r=>r.join("\t")).join("\n");try{navigator.clipboard.writeText(t)}catch(e){const a=document.createElement("textarea");a.value=t;document.body.appendChild(a);a.select();document.execCommand("copy");a.remove()}}
function dl(){const t="Container,Cluster,Miner IP,MAC,Serial,Boards\n"+rows().map(r=>r.join(",")).join("\n");const a=document.createElement("a");a.href="data:text/csv;charset=utf-8,"+encodeURIComponent(t);a.download="pull_list.csv";a.click()}
function pc(l){const o=[];let c="",q=false;for(const ch of l){if(ch=='"')q=!q;else if(ch==","&&!q){o.push(c);c=""}else c+=ch}o.push(c);return o}
function err(m){miners=[];last=[];sel=new Set();src="";document.getElementById("out").innerHTML="";sel_.innerHTML="";document.getElementById("info").textContent=m}
function ingest(A,name){const H=(A[0]||[]).map(x=>String(x??"").replace(/^\uFEFF/,"").trim().toLowerCase());
 const ix=H.indexOf("miner ip"),sx=H.indexOf("serial number"),bx=H.indexOf("affected boards"),mx=H.indexOf("miner mac");
 if(ix<0||bx<0){err("Could not read "+name+": needs Miner IP and Affected Boards columns in the first row (unresolved alerts export). Nothing loaded.");return}
 const R=A.slice(1).filter(r=>r[ix]).map(r=>[String(r[ix]).trim(),sx>=0?String(r[sx]??""):"",String(r[bx]??"").replace(/\s/g,""),mx>=0?String(r[mx]??""):""]);
 if(!R.length){err("No miner rows found in "+name);return}
 src=name;load(R)}
f.onchange=e=>{const fl=e.target.files[0];if(!fl)return;const x=/\.xls[xm]?$/i.test(fl.name);const r=new FileReader();
 r.onerror=()=>err("Could not read file");
 r.onload=()=>{try{if(x){if(!window.XLSX){err("Excel reader did not load - save as CSV or check your connection");return}
  const wb=XLSX.read(r.result,{type:"array"});let A=[];for(const n of wb.SheetNames){A=XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,raw:false,defval:""});if(A.length&&A[0].some(v=>/miner ip/i.test(v)))break}
  ingest(A,fl.name)}else ingest(r.result.split(/\r?\n/).filter(l=>l.trim()).map(pc),fl.name)}catch(ex){err("Could not read "+fl.name+": "+ex.message)}};
 x?r.readAsArrayBuffer(fl):r.readAsText(fl);f.value=""};
function empty(){miners=[];last=[];sel=new Set();document.getElementById("out").innerHTML="";sel_.innerHTML="";document.getElementById("info").textContent="No data loaded. Choose your unresolved alerts file (CSV or Excel) above to start."}
empty();
</script></body></html>
